<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrainFight Singleplayer</title>
    <link rel="icon" type="image/png" href="/global/images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/global/color-pallete.css" />
    <link rel="stylesheet" href="/single/styles.css" />
  </head>
  <body class="solo-body">
    <main class="solo-shell">
      <header class="solo-hero">
        <p class="solo-kicker">BrainFight</p>
        <h1 class="solo-title">Singleplayer Lab</h1>
        <p class="solo-subtitle">Pick a game, play it through, then choose the next one.</p>
      </header>

      <section class="solo-card">
        <div class="solo-controls">
          <p class="solo-label">Choose a game</p>
          <div class="solo-grid" id="game-grid">
            <button class="solo-button solo-button--tile" data-game="reaction-speed" type="button">
              Reaction Speed
            </button>
            <button class="solo-button solo-button--tile" data-game="typing-test" type="button">
              Typing Test
            </button>
            <button class="solo-button solo-button--tile" data-game="number-memory" type="button">
              Number Memory
            </button>
            <button class="solo-button solo-button--tile" data-game="verbal-memory" type="button">
              Verbal Memory
            </button>
          </div>
          <p id="status" class="solo-status">Pick a game to begin.</p>
        </div>
      </section>
    </main>

    <script src="/single/scripts.js"></script>
  </body>
</html>
