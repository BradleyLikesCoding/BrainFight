<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join a Battle</title>
    <link rel="icon" type="image/png" href="/global/images/logo.png">
    <link rel="stylesheet" href="/global/color-pallete.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
      .game-frame-wrap { flex:1; display:flex; }
      .game-frame { flex:1; width:100%; border:none; background:var(--bf-bg); }
      .lobby-players { list-style:none; padding:0; margin:0; display:grid; gap:6px; }
      .lobby-players li { padding:6px 10px; border:1px solid rgba(36,158,160,0.35); border-radius:4px; background:rgba(22,27,34,0.8); font-size:0.9rem; }
      .leaderboard-wrap { display:grid; place-items:center; padding:24px; min-height:100vh; }
      .leaderboard-modal { width:min(780px,94vw); background:var(--bf-surface); border:1px solid rgba(36,158,160,0.4); border-radius:8px; padding:20px; display:grid; gap:16px; box-shadow:0 18px 40px rgba(0,0,0,0.35); }
      .leaderboard-hero { display:grid; gap:8px; }
      .leaderboard-title { font-size:1.4rem; margin:0; letter-spacing:0.03em; }
      .leaderboard-table { width:100%; border-collapse:collapse; }
      .leaderboard-table thead th { padding:10px 14px; text-transform:uppercase; font-size:0.75rem; letter-spacing:0.12em; color:var(--bf-muted); text-align:left; border-bottom:1px solid rgba(36,158,160,0.4); }
      .leaderboard-table .th-score { text-align:right; }
      .leaderboard-table tbody td { padding:12px 14px; vertical-align:middle; border-bottom:1px solid rgba(36,158,160,0.2); font-size:0.9rem; }
      .leaderboard-table tbody tr:last-child td { border-bottom:none; }
      .leaderboard-table .rank { font-weight:700; font-size:1rem; width:50px; text-align:center; }
      .leaderboard-table .player-name { font-weight:600; }
      .leaderboard-table .score { text-align:right; font-weight:700; color:var(--bf-accent); }
      .leaderboard-table .rank-1 { background-color:rgba(240,107,26,0.12); }
      .leaderboard-table .rank-2 { background-color:rgba(36,158,160,0.12); }
      .leaderboard-table .rank-3 { background-color:rgba(242,163,64,0.12); }
      .leaderboard-actions { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:12px; }
    </style>
  </head>
  <body class="bf-body">

    <!-- JOIN FORM -->
    <div class="bf-container" id="join-form">
      <header class="bf-header">
        <span style="font-size:0.9rem;font-weight:600;">Join a Battle</span>
      </header>
      <main class="bf-main">
        <div class="bf-card">
          <div class="bf-row">
            <input class="bf-input" type="text" id="joincode" placeholder="Enter host code">
            <input class="bf-input" type="text" id="joinname" placeholder="Enter your name">
            <button class="bf-button bf-button--primary" id="btn-join">Join Game</button>
          </div>
          <p class="bf-muted" id="join-status"></p>
        </div>
      </main>
    </div>

    <!-- LOBBY -->
    <div class="bf-container" id="lobby" style="display:none;">
      <header class="bf-header">
        <h1>Lobby</h1>
      </header>
      <main class="bf-main">
        <div class="bf-card">
          <p class="bf-muted">Waiting for the host to start...</p>
          <p class="bf-muted">Players:</p>
          <ul class="lobby-players" id="lobby-players"></ul>
        </div>
      </main>
    </div>

    <!-- GAME VIEW -->
    <div class="bf-container" id="game-view" style="display:none;">
      <main class="game-frame-wrap">
        <iframe id="game-frame" class="game-frame" src="about:blank" allow="autoplay"></iframe>
      </main>
    </div>

    <!-- RESULTS VIEW -->
    <div class="bf-container" id="results-view" style="display:none;">
      <div class="leaderboard-wrap">
        <div class="leaderboard-modal">
          <section class="leaderboard-hero">
            <div class="bf-row" style="align-items:center;gap:12px;">
              <span class="bf-badge" id="round-badge">Round 1/3</span>
              <h2 class="leaderboard-title" id="result-title">Results</h2>
            </div>
          </section>
          <section>
            <table class="leaderboard-table">
              <thead>
                <tr>
                  <th>Rank</th>
                  <th>Player</th>
                  <th class="th-score">Points</th>
                  <th class="th-score">Round</th>
                </tr>
              </thead>
              <tbody id="results-body"></tbody>
            </table>
          </section>
          <div class="leaderboard-actions">
            <span class="bf-muted">Waiting for host to start next round…</span>
          </div>
        </div>
      </div>
    </div>

    <script src="/join/scripts.js"></script>
  </body>
</html>
