<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join a Battle</title>
    <link rel="stylesheet" href="/global/color-pallete.css">
    <script src="/socket.io/socket.io.js"></script>
  </head>
  <body class="bf-body">
    <!-- Join form -->
    <div class="bf-container" id="join-form">
      <header class="bf-header">
        <h1>Join a Battle</h1>
      </header>
      <main class="bf-main">
        <div class="bf-card">
          <div class="bf-row">
            <input class="bf-input" type="text" id="joincode" placeholder="Enter host code">
            <input class="bf-input" type="text" id="joinname" placeholder="Enter your name">
            <button class="bf-button bf-button--primary" id="btn-join">Join Game</button>
          </div>
          <p class="bf-muted" id="join-status"></p>
        </div>
      </main>
    </div>

    <!-- Lobby (shown after joining) -->
    <div class="bf-container" id="lobby" style="display:none;">
      <header class="bf-header">
        <h1>Lobby</h1>
      </header>
      <main class="bf-main">
        <div class="bf-card">
          <p class="bf-muted">Waiting for the host to start the game...</p>
          <p class="bf-muted">Players in room:</p>
          <ul id="lobby-players" style="list-style:none;padding:0;margin:0;display:grid;gap:6px;"></ul>
        </div>
      </main>
    </div>

    <script src="/join/scripts.js"></script>
  </body>
</html>
