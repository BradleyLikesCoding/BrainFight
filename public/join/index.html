<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join a Battle</title>
    <link rel="stylesheet" href="../global/color-pallete.css">
  </head>
  <body class="bf-body">
    <div id="game" class="bf-container" style="display: none;">
        <header class="bf-header">
            <h1>Waiting for the host to start the game...</h1>
        </header>
    </div>
    <div class="bf-container" id="join-game">
      <header class="bf-header">
        <h1>Join a Battle</h1>
      </header>
      <main class="bf-main">
        <div class="bf-card">
          <div class="bf-row">
            <input class="bf-input" type="text" id="joincode" placeholder="Enter host code">
            <button class="bf-button bf-button--primary" onclick="joinBattle()">Join Game</button>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
