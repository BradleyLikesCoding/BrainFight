<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainFight - Leaderboard</title>
  <link rel="stylesheet" href="color-pallete.css">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap");

    .leaderboard-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 12, 0.7);
      display: grid;
      place-items: center;
      padding: 24px;
      z-index: 1000;
    }

    .leaderboard-modal {
      width: min(780px, 94vw);
      background: var(--bf-surface);
      border: 1px solid rgba(36, 158, 160, 0.4);
      border-radius: 8px;
      padding: 20px;
      display: grid;
      gap: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    .leaderboard-hero {
      display: grid;
      gap: 12px;
    }

    .leaderboard-title {
      font-size: 2.1rem;
      margin: 0;
      letter-spacing: 0.03em;
    }

    .leaderboard-subtitle {
      margin: 0;
      color: var(--bf-muted);
    }

    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      font-family: "Poppins", "Space Grotesk", "Segoe UI", Tahoma, sans-serif;
    }

    .leaderboard-table thead th {
      padding: 12px 14px;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      color: var(--bf-muted);
      text-align: left;
      border-bottom: 1px solid rgba(36, 158, 160, 0.4);
    }

    .leaderboard-table thead .th-score {
      text-align: right;
    }

    .leaderboard-table tbody td {
      padding: 14px;
      vertical-align: middle;
      border-bottom: 1px solid rgba(36, 158, 160, 0.2);
      font-size: 0.95rem;
    }

    .leaderboard-table tbody tr:last-child td {
      border-bottom: none;
    }

    .leaderboard-table .rank {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--bf-text);
      width: 60px;
      text-align: center;
    }

    .leaderboard-table .user {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .leaderboard-table .user .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(36, 158, 160, 0.4);
    }

    .leaderboard-table .user .username {
      font-weight: 600;
    }

    .leaderboard-table .score {
      text-align: right;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--bf-accent);
    }

    .leaderboard-table .rank-1,
    .leaderboard-table .rank-2,
    .leaderboard-table .rank-3 {
      font-weight: 700;
    }

    .leaderboard-table .rank-1 {
      background-color: rgba(240, 107, 26, 0.12);
    }

    .leaderboard-table .rank-2 {
      background-color: rgba(36, 158, 160, 0.12);
    }

    .leaderboard-table .rank-3 {
      background-color: rgba(242, 163, 64, 0.12);
    }

    .leaderboard-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    @media (max-width: 640px) {
      .leaderboard-title {
        font-size: 1.7rem;
      }

      .leaderboard-table .rank {
        width: 46px;
      }

      .leaderboard-table .user .avatar {
        width: 36px;
        height: 36px;
      }
    }
  </style>
</head>
<body class="bf-body" data-next-url="">
  <div class="leaderboard-overlay" role="dialog" aria-modal="true" aria-label="Leaderboard">
    <div class="leaderboard-modal">
      <section class="leaderboard-hero">
        <div class="bf-row">
          <span class="bf-badge">Leaderboard</span>
          <h1 class="leaderboard-title">BrainFight Standings</h1>
        </div>
        <p class="leaderboard-subtitle">Latest results between tests. Dummy data for now.</p>
        <p class="leaderboard-subtitle" id="countdown">Next test starts in 5s</p>
      </section>

      <section>
        <table class="leaderboard-table" aria-label="Leaderboard">
          <thead>
            <tr>
              <th scope="col">Rank</th>
              <th scope="col">User</th>
              <th scope="col" class="th-score">Score</th>
            </tr>
          </thead>
          <tbody>
            <tr class="rank-1">
              <td class="rank">1</td>
              <td class="user">
                <img src="https://placehold.co/45?text=NR" alt="Nova avatar" class="avatar">
                <span class="username">Nova</span>
              </td>
              <td class="score">25,480</td>
            </tr>
            <tr class="rank-2">
              <td class="rank">2</td>
              <td class="user">
                <img src="https://placehold.co/45?text=AX" alt="Axel avatar" class="avatar">
                <span class="username">Axel</span>
              </td>
              <td class="score">23,910</td>
            </tr>
            <tr class="rank-3">
              <td class="rank">3</td>
              <td class="user">
                <img src="https://placehold.co/45?text=MI" alt="Mira avatar" class="avatar">
                <span class="username">Mira</span>
              </td>
              <td class="score">22,500</td>
            </tr>
            <tr>
              <td class="rank">4</td>
              <td class="user">
                <img src="https://placehold.co/45?text=RO" alt="Rowan avatar" class="avatar">
                <span class="username">Rowan</span>
              </td>
              <td class="score">21,880</td>
            </tr>
            <tr>
              <td class="rank">5</td>
              <td class="user">
                <img src="https://placehold.co/45?text=HA" alt="Harper avatar" class="avatar">
                <span class="username">Harper</span>
              </td>
              <td class="score">20,150</td>
            </tr>
          </tbody>
        </table>
      </section>

      <div class="leaderboard-actions">
        <span class="bf-muted">Players: 8</span>
        <button class="bf-button bf-button--primary" type="button" id="start-next">Start Next Test</button>
      </div>
    </div>
  </div>

  <script>
    const countdownEl = document.getElementById("countdown");
    const nextButton = document.getElementById("start-next");
    const nextUrl = document.body.dataset.nextUrl;
    let remaining = 5;

    const tick = () => {
      if (remaining <= 0) {
        countdownEl.textContent = "Starting next test...";
        if (nextUrl) {
          window.location.href = nextUrl;
        }
        clearInterval(timerId);
        return;
      }
      countdownEl.textContent = `Next test starts in ${remaining}s`;
      remaining -= 1;
    };

    const timerId = setInterval(tick, 1000);
    tick();

    nextButton.addEventListener("click", () => {
      if (nextUrl) {
        window.location.href = nextUrl;
      }
    });
  </script>
</body>
</html>
