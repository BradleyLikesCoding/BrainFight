<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global UI Test</title>
  <link rel="stylesheet" href="color-pallete.css">
</head>
<body class="bf-body">
  <div class="bf-container">
    <header class="bf-header">
      <div class="bf-row">
        <span class="bf-badge">Global</span>
        <h1>UI Test Page</h1>
      </div>
    </header>
    <main class="bf-main">
      <section class="bf-card">
        <h2>Buttons</h2>
        <div class="bf-row">
          <button class="bf-button">Default</button>
          <button class="bf-button bf-button--primary">Primary</button>
          <button class="bf-button bf-button--ghost">Ghost</button>
        </div>
      </section>

      <section class="bf-card">
        <h2>Inputs</h2>
        <div class="bf-row">
          <input class="bf-input" type="text" placeholder="Type something...">
          <input class="bf-input" type="email" placeholder="Email address">
        </div>
      </section>

      <section class="bf-card">
        <h2>Layout</h2>
        <p class="bf-muted">Cards, rows, and badges are shared across the site.</p>
        <div class="bf-row">
          <span class="bf-badge">Badge</span>
          <span class="bf-badge">Palette</span>
          <span class="bf-badge">Test</span>
        </div>
      </section>
    </main>
    <footer class="bf-footer">
      <p>Global styles test page.</p>
    </footer>
  </div>
</body>
</html>
