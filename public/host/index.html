<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host a Battle</title>
    <link rel="stylesheet" href="/global/color-pallete.css">
    <link rel="stylesheet" href="/host/styles.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bf-body">
    <div class="bf-container">
        <header class="bf-header">
            <div class="host-topbar">
                <h1>Host</h1>
                <span class="bf-badge" id="HostCode">Loading Code...</span>
            </div>
        </header>
        <main class="bf-main">
            <div class="bf-card">
                <p class="bf-muted">Share the code above to invite players.</p>
                <button class="bf-button" onclick="location.href='/join'">Join the battle here!</button>
            </div>
            <div class="bf-card">
                <p class="bf-muted">Players</p>
                <ul class="players-list" id="players-list"></ul>
                <p class="bf-muted" id="players-empty">Waiting for players to join...</p>
            </div>
        </main>
    </div>
    <script>
        const hostCodeEl = document.getElementById("HostCode");
        const playersListEl = document.getElementById("players-list");
        const playersEmptyEl = document.getElementById("players-empty");

        const socket = io(window.location.hostname + ':3000');

        const renderPlayers = (players) => {
            playersListEl.innerHTML = "";
            if (!players || players.length === 0) {
                playersEmptyEl.style.display = "block";
                return;
            }
            playersEmptyEl.style.display = "none";
            players.forEach((name) => {
                const item = document.createElement("li");
                item.textContent = name;
                playersListEl.appendChild(item);
            });
        };

        socket.emit("host", (response) => {
            if (response && response.pin) {
                hostCodeEl.textContent = response.pin;
                renderPlayers([]);
            } else {
                hostCodeEl.textContent = "Error";
            }
        });

        socket.on("players-updated", (players) => {
            renderPlayers(players);
        });
    </script>
</body>
</html>
