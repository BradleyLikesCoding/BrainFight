<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host a Battle</title>
    <link rel="icon" type="image/svg+xml" href="/global/images/logo.svg">
    <link rel="icon" type="image/png" href="/global/images/logo.png">
    <link rel="stylesheet" href="/global/color-pallete.css">
    <link rel="stylesheet" href="/host/styles.css">
    <script src="/socket.io/socket.io.js"></script>
  </head>
  <body class="bf-body">

    <!-- LOBBY VIEW -->
    <div class="bf-container" id="lobby-view">
      <header class="bf-header host-header">
        <span class="host-title">Host</span>
        <span class="host-code" id="host-code">...</span>
        <button class="bf-button bf-button--ghost btn-sm" id="btn-copy">Copy</button>
      </header>
      <main class="bf-main host-main">
        <div class="bf-card host-card">
          <p class="bf-muted sm">Players (<span id="player-count">0</span>)</p>
          <ul class="players-list" id="players-list"></ul>
          <p class="bf-muted sm" id="players-empty">Waiting for players…</p>
        </div>
        <div class="bf-card host-card">
          <p class="bf-muted sm">Settings</p>
          <div class="bf-row">
            <label class="sm">Mode</label>
            <select class="bf-input btn-sm" id="game-mode">
              <option value="random">Random</option>
              <option value="choose">Choose</option>
            </select>
          </div>
          <div class="bf-row" id="game-pick-row" style="display:none;">
            <label class="sm">Game</label>
            <select class="bf-input btn-sm" id="game-pick">
              <option value="reaction-speed">Reaction Speed</option>
              <option value="typing-test">Typing Test</option>
              <option value="number-memory">Number Memory</option>
              <option value="verbal-memory">Verbal Memory</option>
            </select>
          </div>
          <div class="bf-row">
            <label class="sm">Rounds</label>
            <input type="number" class="bf-input btn-sm" id="game-rounds" min="1" max="99" value="3" style="width:60px;">
          </div>
        </div>
        <div class="host-actions">
          <button class="bf-button bf-button--primary btn-sm" id="btn-start" disabled>Start</button>
          <button class="bf-button btn-sm" onclick="window.open('/join','_blank')">Join</button>
          <span class="bf-muted sm" id="status-text"></span>
        </div>
      </main>
    </div>

    <!-- GAME VIEW (benchmark in iframe) -->
    <div class="bf-container" id="game-view" style="display:none;">
      <main class="game-frame-wrap">
        <iframe id="game-frame" class="game-frame" src="about:blank" allow="autoplay"></iframe>
      </main>
    </div>

    <!-- RESULTS VIEW -->
    <div class="bf-container" id="results-view" style="display:none;">
      <div class="leaderboard-wrap">
        <div class="leaderboard-modal">
          <section class="leaderboard-hero">
            <div class="bf-row" style="align-items:center;gap:12px;">
              <span class="bf-badge" id="round-badge">Round 1/3</span>
              <h2 class="leaderboard-title" id="result-title">Results</h2>
            </div>
          </section>
          <section>
            <table class="leaderboard-table">
              <thead>
                <tr>
                  <th>Rank</th>
                  <th>Player</th>
                  <th class="th-score">Points</th>
                  <th class="th-score">Round</th>
                </tr>
              </thead>
              <tbody id="results-body"></tbody>
            </table>
          </section>
          <div class="leaderboard-actions">
            <div class="bf-row" id="next-game-row" style="display:none;align-items:center;gap:8px;">
              <label class="sm">Next Game</label>
              <select class="bf-input btn-sm" id="next-game-pick">
                <option value="reaction-speed">Reaction Speed</option>
                <option value="typing-test">Typing Test</option>
                <option value="number-memory">Number Memory</option>
                <option value="verbal-memory">Verbal Memory</option>
              </select>
            </div>
            <button class="bf-button bf-button--primary btn-sm" id="btn-next">Next Round</button>
          </div>
        </div>
      </div>
    </div>

    <script src="/host/scripts.js"></script>
  </body>
</html>
