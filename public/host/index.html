<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host a Battle</title>
    <link rel="stylesheet" href="/global/color-pallete.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bf-body">
    <div class="bf-container">
        <header class="bf-header">
            <div class="bf-row">
                <h1>Host a Battle</h1>
                <span class="bf-badge" id="HostCode">Loading Code...</span>
            </div>
        </header>
        <main class="bf-main">
            <div class="bf-card">
                <p class="bf-muted">Share the code above to invite players.</p>
                <button class="bf-button" onclick="location.href='/join'">Join the battle here!</button>
            </div>
        </main>
    </div>
</body>
</html>
