<!DOCTYPE html>

    <title>BrainFight - Human battles</title>
    <link rel="stylesheet" href="../global/color-pallete.css">
    <link rel="stylesheet" href="styles.css">

<body class="bf-body">
    <div class="bf-container">
        <header class="bf-header">

                <span class="bf-badge">BrainFight</span>
