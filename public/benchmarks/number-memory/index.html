<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Memory</title>
    <link rel="icon" type="image/png" href="/global/images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/global/color-pallete.css" />
    <link rel="stylesheet" href="/benchmarks/number-memory/styles.css" />
  </head>
  <body>
    <main class="page">
      <nav class="top-bar">
        <span class="brand">Brainfight</span>
        <span class="mode">Number memory</span>
      </nav>

      <section class="game">
        <div id="stage" class="stage">
          <p id="status" class="stage-label">Press Start</p>
          <p id="number" class="number">--</p>
          <button id="stage-start" class="button stage-button" type="button">
            Start
          </button>
        </div>

        <div class="input-row" id="input-row">
          <input
            id="answer"
            class="answer"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="Enter the number"
            disabled
          />
          <button id="submit-button" class="button" type="button" disabled>
            Submit
          </button>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="stat-label">Round</span>
            <span id="round" class="stat-value">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Digits</span>
            <span id="digits" class="stat-value">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Lives</span>
            <span id="lives" class="stat-value">1</span>
          </div>
        </div>

        <div class="controls">
          <button id="restart-button" class="button hidden" type="button">
            Restart
          </button>
        </div>
      </section>
    </main>

    <script src="script.js" defer></script>
  </body>
</html>
