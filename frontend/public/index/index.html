<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrainFight</title>
    <link rel="stylesheet" href="global/color-pallete.css" />
    <style>
      :root {
        color-scheme: light;
        --text-on-dark: #f7f7f7;
        --surface-dark: #262627;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: var(--color-secondary);
        color: var(--text-on-dark);
      }

      main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .menu {
        width: min(720px, 100%);
        background: var(--surface-dark);
        color: var(--text-on-dark);
        border-radius: 16px;
        padding: 28px;
        border: 2px solid var(--color-tertiary);
        box-shadow: 0 18px 32px rgba(0, 0, 0, 0.22);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 30px;
      }

      p {
        margin: 0 0 16px;
        color: #c7c7c7;
      }

      nav ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 12px;
      }

      nav a {
        display: block;
        padding: 12px 16px;
        border-radius: 12px;
        text-decoration: none;
        color: var(--text-on-dark);
        background: #1f1f20;
        border: 1px solid transparent;
      }

      nav a:hover,
      nav a:focus-visible {
        border-color: var(--color-tertiary);
        outline: none;
      }

      .pill {
        display: inline-block;
        margin-left: 8px;
        font-size: 12px;
        padding: 3px 8px;
        border-radius: 999px;
        background: var(--color-primary);
        color: #1f1f1f;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="menu" aria-label="Main menu">
        <h1>BrainFight</h1>
        <p>Pick a challenge to start.</p>
        <nav>
          <ul>
            <li>
              <a href="reaction/index.html">Reaction Time <span class="pill">Play</span></a>
            </li>
            <li>
              <a href="#coming-soon">Memory Match</a>
            </li>
            <li>
              <a href="#coming-soon">Aim Trainer</a>
            </li>
          </ul>
        </nav>
      </section>
    </main>
  </body>
</html>
