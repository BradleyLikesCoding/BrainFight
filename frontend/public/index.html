<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrainFight</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f6f7f9;
        color: #1a1a1a;
      }

      .menu {
        max-width: 720px;
        margin: 12vh auto 0;
        padding: 24px;
        background: #ffffff;
        border: 1px solid #e3e6ea;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin: 0 0 16px;
        font-size: 28px;
      }

      nav ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      nav li {
        margin: 8px 0;
      }

      nav a {
        display: block;
        padding: 10px 12px;
        border-radius: 8px;
        text-decoration: none;
        color: inherit;
        background: #f1f3f6;
      }

      nav a:hover,
      nav a:focus-visible {
        background: #e6eaf0;
        outline: none;
      }
    </style>
  </head>
  <body>
    <main class="menu">
      <h1>BrainFight</h1>
      <nav aria-label="Main menu">
        <ul>
          <li><a href="#play">Play</a></li>
          <li><a href="#how-to">How to Play</a></li>
          <li><a href="#settings">Settings</a></li>
          <li><a href="#credits">Credits</a></li>
        </ul>
      </nav>
    </main>
  </body>
</html>
